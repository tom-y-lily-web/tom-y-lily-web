<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> Neon Snake Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: 'Orbitron', monospace;
            color: #fff;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #000000 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
        }

        .hud-item {
            font-size: clamp(0.6rem, 2.5vw, 0.85rem);
            color: #00ff88;
            text-shadow: 0 0 8px #00ff88;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hud-item .value {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.55rem, 2vw, 0.7rem);
            color: #fff;
        }

        .combo-bar {
            position: absolute;
            top: 38px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3px;
            z-index: 5;
            pointer-events: none;
        }

        .combo-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #333;
            border: 1px solid #555;
            transition: all 0.3s;
        }

        .combo-dot.active {
            background: #ffd700;
            box-shadow: 0 0 8px #ffd700;
            border-color: #ffd700;
        }

        /* CONTROLES TÁCTILES */
        .touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 140px;
            z-index: 10;
            display: none;
            pointer-events: none;
        }

        .touch-controls.active {
            display: block;
        }

        /* D-Pad para Snake */
        .dpad {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 130px;
            height: 130px;
            pointer-events: auto;
        }

        .dpad-btn {
            position: absolute;
            width: 42px;
            height: 42px;
            background: rgba(0, 255, 136, 0.15);
            border: 2px solid rgba(0, 255, 136, 0.4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #00ff88;
            cursor: pointer;
            transition: all 0.1s;
        }

        .dpad-btn:active,
        .dpad-btn.pressed {
            background: rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            transform: scale(0.92);
        }

        .dpad-up {
            top: 0;
            left: 44px;
        }

        .dpad-down {
            bottom: 0;
            left: 44px;
        }

        .dpad-left {
            top: 44px;
            left: 0;
        }

        .dpad-right {
            top: 44px;
            right: 0;
        }

        /* Botón de pausa táctil */
        .pause-btn-touch {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 38px;
            height: 38px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
            cursor: pointer;
        }

        .pause-btn-touch.active {
            display: flex;
        }

        /* OVERLAYS */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.92);
            z-index: 20;
            transition: opacity 0.5s;
            backdrop-filter: blur(8px);
            padding: 15px;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.4rem, 6vw, 2.5rem);
            font-weight: 900;
            color: #00ff88;
            text-shadow:
                0 0 10px #00ff88,
                0 0 30px #00ff88,
                0 0 60px rgba(0, 255, 136, 0.5);
            margin-bottom: 6px;
            animation: titlePulse 2s ease-in-out infinite;
            text-align: center;
            line-height: 1.2;
        }

        .game-subtitle {
            font-size: clamp(0.65rem, 2.5vw, 0.9rem);
            color: #888;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-align: center;
        }

        .btn {
            padding: 12px 40px;
            margin: 6px;
            font-family: 'Orbitron', monospace;
            font-size: clamp(0.8rem, 3vw, 0.95rem);
            font-weight: 700;
            border: 2px solid #00ff88;
            background: transparent;
            color: #00ff88;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            min-width: 180px;
            text-align: center;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before,
        .btn:active::before {
            left: 100%;
        }

        .btn:hover,
        .btn:active {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 25px #00ff88;
            transform: translateY(-2px);
        }

        .btn-back {
            border-color: #ff6b9d;
            color: #ff6b9d;
            font-size: clamp(0.65rem, 2.5vw, 0.8rem);
            padding: 9px 25px;
            min-width: auto;
        }

        .btn-back:hover,
        .btn-back:active {
            background: #ff6b9d;
            box-shadow: 0 0 18px #ff6b9d;
        }

        .btn-mode {
            border-color: #ffaa00;
            color: #ffaa00;
            font-size: clamp(0.7rem, 2.5vw, 0.8rem);
            padding: 9px 20px;
            min-width: auto;
        }

        .btn-mode:hover,
        .btn-mode:active {
            background: #ffaa00;
            box-shadow: 0 0 18px #ffaa00;
        }

        .btn-mode.selected {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 12px #ffaa00;
        }

        .final-score-box {
            text-align: center;
            margin: 10px 0 18px;
        }

        .final-score-label {
            font-size: clamp(0.6rem, 2vw, 0.7rem);
            color: #888;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }

        .final-score-value {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(1.3rem, 4vw, 1.6rem);
            color: #ffd700;
            text-shadow: 0 0 15px #ffd700;
        }

        .stats-row {
            display: flex;
            gap: 15px;
            margin-bottom: 18px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: clamp(0.5rem, 1.8vw, 0.6rem);
            color: #666;
            letter-spacing: 2px;
        }

        .stat-value {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.75rem, 2.5vw, 0.85rem);
            color: #00ff88;
            margin-top: 3px;
        }

        .controls-hint-desktop {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(0.55rem, 1.8vw, 0.65rem);
            color: rgba(255, 255, 255, 0.25);
            text-align: center;
            z-index: 5;
            pointer-events: none;
            letter-spacing: 1px;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .powerup-indicator {
            position: absolute;
            bottom: 145px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 5;
            pointer-events: none;
        }

        .powerup-icon {
            width: 26px;
            height: 26px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            border: 2px solid;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s;
        }

        .powerup-icon.active {
            opacity: 1;
            transform: scale(1);
            animation: powerupPulse 1s ease-in-out infinite;
        }

        .notification {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1rem, 3.5vw, 1.3rem);
            font-weight: 700;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            text-align: center;
            white-space: nowrap;
        }

        .notification.show {
            animation: notifAnim 1.5s ease-out forwards;
        }

        /* Orientación hint */
        .orientation-hint {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .orientation-hint .icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            animation: rotatePhone 2s ease-in-out infinite;
        }

        @keyframes titlePulse {

            0%,
            100% {
                transform: scale(1);
                text-shadow: 0 0 10px #00ff88, 0 0 30px #00ff88;
            }

            50% {
                transform: scale(1.03);
                text-shadow: 0 0 20px #00ff88, 0 0 50px #00ff88, 0 0 80px rgba(0, 255, 136, 0.3);
            }
        }

        @keyframes powerupPulse {

            0%,
            100% {
                box-shadow: 0 0 5px currentColor;
            }

            50% {
                box-shadow: 0 0 15px currentColor, 0 0 30px currentColor;
            }
        }

        @keyframes notifAnim {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }

            15% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }

            30% {
                transform: translate(-50%, -50%) scale(1);
            }

            70% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -80%) scale(0.9);
            }
        }

        @keyframes rotatePhone {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(90deg);
            }
        }

        @media screen and (max-width: 500px) and (orientation: portrait) {
            .orientation-hint {
                display: flex;
            }
        }

        /* Desktop: ocultar controles táctiles */
        @media (hover: hover) and (pointer: fine) {
            .touch-controls {
                display: none !important;
            }

            .pause-btn-touch {
                display: none !important;
            }
        }

        /* Móvil: mostrar controles táctiles */
        @media (hover: none) and (pointer: coarse) {
            .touch-controls.active {
                display: block;
            }

            .pause-btn-touch.active {
                display: flex;
            }
        }
    </style>
</head>

<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- Orientación hint -->
        <div class="orientation-hint" id="orientationHint">
            <div class="icon"></div>
            <div class="game-title" style="font-size:1.3rem;margin-bottom:8px;">Gira tu celular</div>
            <div class="game-subtitle">Modo horizontal para jugar mejor</div>
        </div>

        <!-- HUD -->
        <div class="hud" id="hud" style="display:none;">
            <div class="hud-item"> <span class="value" id="scoreDisplay">0</span></div>
            <div class="hud-item"> <span class="value" id="bestDisplay">0</span></div>
            <div class="hud-item"> <span class="value" id="lengthDisplay">3</span></div>
        </div>

        <div class="combo-bar" id="comboBar" style="display:none;"></div>

        <div class="powerup-indicator" id="powerupIndicator" style="display:none;">
            <div class="powerup-icon" id="iconSpeed" style="border-color:#00d4ff;color:#00d4ff;"></div>
            <div class="powerup-icon" id="iconGhost" style="border-color:#aa66ff;color:#aa66ff;"></div>
            <div class="powerup-icon" id="iconMagnet" style="border-color:#ffaa00;color:#ffaa00;"></div>
        </div>

        <div class="controls-hint-desktop" id="controlsHint">
            FLECHAS / WASD para mover • P para pausar
        </div>

        <div class="notification" id="notification"></div>

        <!-- Botón pausa táctil -->
        <div class="pause-btn-touch" id="pauseBtnTouch">⏸</div>

        <!-- Controles táctiles D-Pad -->
        <div class="touch-controls" id="touchControls">
            <div class="dpad" id="dpad">
                <div class="dpad-btn dpad-up" data-dir="up">▲</div>
                <div class="dpad-btn dpad-down" data-dir="down">▼</div>
                <div class="dpad-btn dpad-left" data-dir="left">◀</div>
                <div class="dpad-btn dpad-right" data-dir="right">▶</div>
            </div>
        </div>

        <!-- Pantalla de inicio -->
        <div class="overlay" id="startScreen">
            <div class="game-title"> NEON SNAKE<br>ARENA</div>
            <div class="game-subtitle">EL CLÁSICO, REINVENTADO</div>

            <div class="mode-selector">
                <button class="btn btn-mode selected" id="btnClassic" onclick="selectMode('classic')">CLÁSICO</button>
                <button class="btn btn-mode" id="btnSurvival" onclick="selectMode('survival')">SUPERVIVENCIA</button>
            </div>

            <button class="btn" onclick="startGame()">JUGAR</button>
            <button class="btn btn-back" onclick="goBack()">← VOLVER A JUEGOS</button>
        </div>

        <!-- Pantalla de pausa -->
        <div class="overlay hidden" id="pauseScreen">
            <div class="game-title" style="font-size:1.8rem;">PAUSA</div>
            <button class="btn" onclick="resumeGame()">CONTINUAR</button>
            <button class="btn btn-back" onclick="goToMenu()">MENÚ PRINCIPAL</button>
        </div>

        <!-- Pantalla de Game Over -->
        <div class="overlay hidden" id="gameOverScreen">
            <div class="game-title" style="color:#ff4444;text-shadow:0 0 20px #ff4444;">GAME OVER</div>

            <div class="final-score-box">
                <div class="final-score-label">PUNTUACIÓN FINAL</div>
                <div class="final-score-value" id="finalScore">0</div>
            </div>

            <div class="stats-row">
                <div class="stat">
                    <div class="stat-label">LONGITUD</div>
                    <div class="stat-value" id="finalLength">3</div>
                </div>
                <div class="stat">
                    <div class="stat-label">COMBO MAX</div>
                    <div class="stat-value" id="finalCombo">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">TIEMPO</div>
                    <div class="stat-value" id="finalTime">0s</div>
                </div>
            </div>

            <button class="btn" onclick="startGame()">REINTENTAR</button>
            <button class="btn btn-back" onclick="goBack()">← VOLVER A JUEGOS</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Detección de dispositivo
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        // Configuración de grid adaptable
        let GRID_SIZE = 20;
        let CELL_SIZE;
        let COLS, ROWS;

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            // Adaptar grid según tamaño de pantalla
            CELL_SIZE = Math.floor(Math.min(canvas.width, canvas.height) / GRID_SIZE);
            COLS = Math.floor(canvas.width / CELL_SIZE);
            ROWS = Math.floor(canvas.height / CELL_SIZE);

            // Asegurar mínimo de celdas
            if (COLS < 15) {
                GRID_SIZE = 15;
                CELL_SIZE = Math.floor(Math.min(canvas.width, canvas.height) / GRID_SIZE);
                COLS = Math.floor(canvas.width / CELL_SIZE);
                ROWS = Math.floor(canvas.height / CELL_SIZE);
            }
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (gameState === 'playing') {
                snake = snake.map(s => ({
                    x: Math.min(s.x, COLS - 2),
                    y: Math.min(s.y, ROWS - 2)
                }));
            }
        });

        // Estado del juego
        let gameState = 'menu';
        let gameMode = 'classic';
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('snakeBestScore')) || 0;
        let startTime = 0;
        let gameTime = 0;
        let combo = 0;
        let maxCombo = 0;
        let comboTimer = null;

        // Snake
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let moveTimer = 0;
        let baseSpeed = 8;
        let currentSpeed = baseSpeed;

        // Comida
        let food = null;
        let foodType = 'normal';
        let foodPulse = 0;

        // Power-ups
        let powerUp = null;
        let activePowerUps = {
            speed: 0,
            ghost: 0,
            magnet: 0
        };

        // Obstáculos
        let obstacles = [];
        let obstacleTimer = 0;

        // Partículas
        let particles = [];
        let floatingTexts = [];
        let gridEffects = [];

        // Input táctil D-Pad
        let touchDirection = null;

        // Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch (type) {
                case 'eat':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.05);
                    osc.frequency.setValueAtTime(784, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'eatGolden':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.05);
                    osc.frequency.setValueAtTime(784, now + 0.1);
                    osc.frequency.setValueAtTime(1047, now + 0.15);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                    break;
                case 'die':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
                case 'powerup':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554, now + 0.1);
                    osc.frequency.setValueAtTime(659, now + 0.2);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'combo':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'obstacle':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
            }
        }

        // Controles de teclado
        const keys = {};
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;

            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) {
                e.preventDefault();
            }

            if (gameState === 'playing') {
                if ((key === 'arrowup' || key === 'w') && direction.y === 0) {
                    nextDirection = { x: 0, y: -1 };
                } else if ((key === 'arrowdown' || key === 's') && direction.y === 0) {
                    nextDirection = { x: 0, y: 1 };
                } else if ((key === 'arrowleft' || key === 'a') && direction.x === 0) {
                    nextDirection = { x: -1, y: 0 };
                } else if ((key === 'arrowright' || key === 'd') && direction.x === 0) {
                    nextDirection = { x: 1, y: 0 };
                } else if (key === 'p') {
                    togglePause();
                }
            }
        });

        // Controles táctiles D-Pad
        const dpadBtns = document.querySelectorAll('.dpad-btn');

        dpadBtns.forEach(btn => {
            // Touch events
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const dir = btn.dataset.dir;
                handleDpadInput(dir);
                btn.classList.add('pressed');
            }, { passive: false });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                btn.classList.remove('pressed');
            }, { passive: false });

            btn.addEventListener('touchcancel', (e) => {
                btn.classList.remove('pressed');
            });

            // Mouse events (para testing en desktop)
            btn.addEventListener('mousedown', (e) => {
                const dir = btn.dataset.dir;
                handleDpadInput(dir);
                btn.classList.add('pressed');
            });

            btn.addEventListener('mouseup', () => {
                btn.classList.remove('pressed');
            });

            btn.addEventListener('mouseleave', () => {
                btn.classList.remove('pressed');
            });
        });

        function handleDpadInput(dir) {
            if (gameState !== 'playing') return;

            switch (dir) {
                case 'up':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    break;
                case 'down':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    break;
                case 'left':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    break;
                case 'right':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    break;
            }
        }

        // Botón de pausa táctil
        document.getElementById('pauseBtnTouch').addEventListener('click', togglePause);
        document.getElementById('pauseBtnTouch').addEventListener('touchstart', (e) => {
            e.preventDefault();
            togglePause();
        }, { passive: false });

        // Swipe detection para móvil (alternativa al D-Pad)
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (gameState !== 'playing') return;

            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            const dx = touchX - touchStartX;
            const dy = touchY - touchStartY;
            const minSwipe = 30;

            if (Math.abs(dx) > minSwipe || Math.abs(dy) > minSwipe) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0 && direction.x === 0) nextDirection = { x: 1, y: 0 };
                    else if (dx < 0 && direction.x === 0) nextDirection = { x: -1, y: 0 };
                } else {
                    if (dy > 0 && direction.y === 0) nextDirection = { x: 0, y: 1 };
                    else if (dy < 0 && direction.y === 0) nextDirection = { x: 0, y: -1 };
                }
                touchStartX = touchX;
                touchStartY = touchY;
            }
        }, { passive: true });

        // Seleccionar modo
        function selectMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('selected'));
            document.getElementById(mode === 'classic' ? 'btnClassic' : 'btnSurvival').classList.add('selected');
        }

        // Inicializar combo bar
        function initComboBar() {
            const bar = document.getElementById('comboBar');
            bar.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const dot = document.createElement('div');
                dot.className = 'combo-dot';
                bar.appendChild(dot);
            }
        }

        // Mostrar notificación
        function showNotification(text, color = '#00ff88') {
            const el = document.getElementById('notification');
            el.textContent = text;
            el.style.color = color;
            el.style.textShadow = `0 0 20px ${color}`;
            el.classList.remove('show');
            void el.offsetWidth;
            el.classList.add('show');
        }

        // Spawn comida
        function spawnFood() {
            let attempts = 0;
            do {
                food = {
                    x: Math.floor(Math.random() * (COLS - 2)) + 1,
                    y: Math.floor(Math.random() * (ROWS - 2)) + 1
                };
                attempts++;
            } while (isOccupied(food.x, food.y) && attempts < 100);

            const rand = Math.random();
            if (rand < 0.05) foodType = 'golden';
            else if (rand < 0.15 && gameMode === 'survival') foodType = 'poison';
            else foodType = 'normal';
        }

        // Spawn power-up
        function spawnPowerUp() {
            if (powerUp || Math.random() > 0.3) return;
            let attempts = 0;
            do {
                powerUp = {
                    x: Math.floor(Math.random() * (COLS - 2)) + 1,
                    y: Math.floor(Math.random() * (ROWS - 2)) + 1,
                    type: ['speed', 'ghost', 'magnet'][Math.floor(Math.random() * 3)]
                };
                attempts++;
            } while (isOccupied(powerUp.x, powerUp.y) && attempts < 100);
        }

        // Spawn obstáculo
        function spawnObstacle() {
            if (gameMode !== 'survival') return;
            let attempts = 0;
            let obs;
            do {
                obs = {
                    x: Math.floor(Math.random() * (COLS - 2)) + 1,
                    y: Math.floor(Math.random() * (ROWS - 2)) + 1
                };
                attempts++;
            } while ((isOccupied(obs.x, obs.y) || (Math.abs(obs.x - snake[0].x) < 5 && Math.abs(obs.y - snake[0].y) < 5)) && attempts < 100);

            if (attempts < 100) {
                obstacles.push(obs);
                playSound('obstacle');
                createParticles(obs.x * CELL_SIZE + CELL_SIZE / 2, obs.y * CELL_SIZE + CELL_SIZE / 2, '#ff4444', 8);
            }
        }

        function isOccupied(x, y) {
            return snake.some(s => s.x === x && s.y === y) ||
                obstacles.some(o => o.x === x && o.y === y) ||
                (powerUp && powerUp.x === x && powerUp.y === y);
        }

        // Crear partículas
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x, y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    life: 1,
                    decay: Math.random() * 0.04 + 0.02,
                    color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        // Texto flotante
        function addFloatingText(x, y, text, color) {
            floatingTexts.push({
                x, y, text, color,
                life: 1,
                dy: -1.5
            });
        }

        // Efecto de grid
        function addGridEffect(x, y, color) {
            gridEffects.push({
                x, y, color,
                life: 1,
                maxLife: 20
            });
        }

        // Iniciar juego
        function startGame() {
            gameState = 'playing';
            score = 0;
            combo = 0;
            maxCombo = 0;
            gameTime = 0;
            startTime = Date.now();

            resizeCanvas();

            snake = [
                { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) },
                { x: Math.floor(COLS / 2) - 1, y: Math.floor(ROWS / 2) },
                { x: Math.floor(COLS / 2) - 2, y: Math.floor(ROWS / 2) }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };

            obstacles = [];
            particles = [];
            floatingTexts = [];
            gridEffects = [];
            powerUp = null;
            activePowerUps = { speed: 0, ghost: 0, magnet: 0 };
            currentSpeed = baseSpeed;

            if (gameMode === 'survival') {
                for (let i = 0; i < 5; i++) spawnObstacle();
            }

            spawnFood();
            initComboBar();

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('comboBar').style.display = 'flex';
            document.getElementById('powerupIndicator').style.display = 'flex';
            document.getElementById('controlsHint').style.display = isTouchDevice ? 'none' : 'block';
            document.getElementById('touchControls').classList.toggle('active', isTouchDevice);
            document.getElementById('pauseBtnTouch').classList.toggle('active', isTouchDevice);
            document.getElementById('bestDisplay').textContent = bestScore;

            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Pausar
        function togglePause() {
            if (gameState === 'playing') {
                gameState = 'paused';
                document.getElementById('pauseScreen').classList.remove('hidden');
                document.getElementById('touchControls').classList.remove('active');
            } else if (gameState === 'paused') {
                resumeGame();
            }
        }

        // Reanudar
        function resumeGame() {
            gameState = 'playing';
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('touchControls').classList.toggle('active', isTouchDevice);
            startTime = Date.now() - gameTime * 1000;
        }

        // Ir al menú
        function goToMenu() {

            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('hud').style.display = 'none';

            document.getElementById('powerupIndicator').style.display = 'none';

        // Game Over
        function gameOver() {
            gameState = 'gameover';
            playSound('die');

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('snakeBestScore', bestScore);
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLength').textContent = snake.length;
            document.getElementById('finalCombo').textContent = maxCombo;
            document.getElementById('finalTime').textContent = Math.floor(gameTime) + 's';

            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('hud').style.display = 'none';
            document.getElementById('comboBar').style.display = 'none';
            document.getElementById('powerupIndicator').style.display = 'none';
            document.getElementById('controlsHint').style.display = 'none';

            document.getElementById('pauseBtnTouch').classList.remove('active');
        }

        // Volver a juegos
        function goBack() {
            window.location.href = '../Juegos.html';
        }

        // Actualizar power-up indicators
        function updatePowerUpIndicators() {
            document.getElementById('iconSpeed').classList.toggle('active', activePowerUps.speed > 0);
            document.getElementById('iconGhost').classList.toggle('active', activePowerUps.ghost > 0);
            document.getElementById('iconMagnet').classList.toggle('active', activePowerUps.magnet > 0);
        }

        // Actualizar combo visual
        function updateComboBar() {
            const dots = document.querySelectorAll('.combo-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i < combo);
            });
        }

        // Lógica principal
        let lastTime = 0;
        function update(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            if (gameState !== 'playing') {
                requestAnimationFrame(update);
                return;
            }

            gameTime = (Date.now() - startTime) / 1000;

            // Actualizar power-ups
            Object.keys(activePowerUps).forEach(key => {
                if (activePowerUps[key] > 0) activePowerUps[key]--;
            });
            updatePowerUpIndicators();

            // Velocidad según power-up
            currentSpeed = activePowerUps.speed > 0 ? baseSpeed * 1.8 : baseSpeed;

            // Movimiento de la serpiente
            moveTimer += deltaTime;
            const moveInterval = 1000 / currentSpeed;

            if (moveTimer >= moveInterval) {
                moveTimer = 0;
                direction = { ...nextDirection };

                const head = { ...snake[0] };
                head.x += direction.x;
                head.y += direction.y;

                // Colisión con paredes
                if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                    if (activePowerUps.ghost > 0) {
                        head.x = (head.x + COLS) % COLS;
                        head.y = (head.y + ROWS) % ROWS;
                    } else {
                        gameOver();
                        requestAnimationFrame(update);
                        return;
                    }
                }

                // Colisión con sí misma
                if (activePowerUps.ghost <= 0 && snake.some(s => s.x === head.x && s.y === head.y)) {
                    gameOver();
                    requestAnimationFrame(update);
                    return;
                }

                // Colisión con obstáculos
                if (obstacles.some(o => o.x === head.x && o.y === head.y)) {
                    gameOver();
                    requestAnimationFrame(update);
                    return;
                }

                snake.unshift(head);

                // Comer comida
                if (food && head.x === food.x && head.y === food.y) {
                    let points = 10;
                    let color = '#00ff88';

                    if (foodType === 'golden') {
                        points = 50;
                        color = '#ffd700';
                        playSound('eatGolden');
                        showNotification('¡DORADO! +50', '#ffd700');
                    } else if (foodType === 'poison') {
                        points = -20;
                        color = '#ff4444';
                        snake.pop();
                        snake.pop();
                        playSound('die');
                        showNotification('¡VENENO! -20', '#ff4444');
                        if (snake.length < 2) {
                            gameOver();
                            requestAnimationFrame(update);
                            return;
                        }
                    } else {
                        playSound('eat');
                        combo++;
                        if (combo > maxCombo) maxCombo = combo;
                        if (combo >= 5) {
                            points = 20;
                            showNotification('¡COMBO x5! +20', '#ffaa00');
                            playSound('combo');
                            combo = 0;
                        }
                    }

                    score += points;
                    createParticles(head.x * CELL_SIZE + CELL_SIZE / 2, head.y * CELL_SIZE + CELL_SIZE / 2, color, 15);
                    addFloatingText(head.x * CELL_SIZE, head.y * CELL_SIZE, (points > 0 ? '+' : '') + points, color);
                    addGridEffect(head.x, head.y, color);
                    spawnFood();
                    spawnPowerUp();

                    if (gameMode === 'survival') {
                        obstacleTimer++;
                        if (obstacleTimer % 5 === 0) spawnObstacle();
                        baseSpeed = 8 + Math.floor(score / 50);
                    }
                } else {
                    snake.pop();
                }

                // Recoger power-up
                if (powerUp && head.x === powerUp.x && head.y === powerUp.y) {
                    activePowerUps[powerUp.type] = 300;
                    playSound('powerup');
                    const names = { speed: 'VELOCIDAD', ghost: 'FANTASMA', magnet: 'IMÁN' };
                    const colors = { speed: '#00d4ff', ghost: '#aa66ff', magnet: '#ffaa00' };
                    showNotification('¡' + names[powerUp.type] + '!', colors[powerUp.type]);
                    createParticles(powerUp.x * CELL_SIZE + CELL_SIZE / 2, powerUp.y * CELL_SIZE + CELL_SIZE / 2, colors[powerUp.type], 20);
                    powerUp = null;
                }

                updateComboBar();
            }

            // Actualizar partículas
            particles = particles.filter(p => {
                p.x += p.dx;
                p.y += p.dy;
                p.life -= p.decay;
                p.size *= 0.98;
                return p.life > 0;
            });

            // Actualizar textos flotantes
            floatingTexts = floatingTexts.filter(t => {
                t.y += t.dy;
                t.life -= 0.02;
                return t.life > 0;
            });

            // Actualizar efectos de grid
            gridEffects = gridEffects.filter(g => {
                g.life -= 1 / g.maxLife;
                return g.life > 0;
            });

            // Pulso de comida
            foodPulse += 0.08;

            // Spawn power-up ocasional
            if (Math.random() < 0.002) spawnPowerUp();

            // Actualizar HUD
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('lengthDisplay').textContent = snake.length;

            requestAnimationFrame(update);
        }

        // Dibujar
        function draw() {
            // Fondo
            ctx.fillStyle = 'rgba(5, 5, 10, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid sutil
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * CELL_SIZE, 0);
                ctx.lineTo(x * CELL_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * CELL_SIZE);
                ctx.lineTo(canvas.width, y * CELL_SIZE);
                ctx.stroke();
            }

            if (gameState === 'playing' || gameState === 'paused') {
                // Efectos de grid
                gridEffects.forEach(g => {
                    const alpha = g.life * 0.3;
                    const r = parseInt(g.color.slice(1, 3), 16);
                    const gr = parseInt(g.color.slice(3, 5), 16);
                    const b = parseInt(g.color.slice(5, 7), 16);
                    ctx.fillStyle = `rgba(${r}, ${gr}, ${b}, ${alpha})`;
                    ctx.fillRect(g.x * CELL_SIZE, g.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                });

                // Obstáculos
                obstacles.forEach(obs => {
                    ctx.fillStyle = '#ff4444';
                    ctx.shadowColor = '#ff4444';
                    ctx.shadowBlur = 8;
                    const pad = 2;
                    ctx.fillRect(obs.x * CELL_SIZE + pad, obs.y * CELL_SIZE + pad, CELL_SIZE - pad * 2, CELL_SIZE - pad * 2);

                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.moveTo(obs.x * CELL_SIZE + 5, obs.y * CELL_SIZE + 5);
                    ctx.lineTo(obs.x * CELL_SIZE + CELL_SIZE - 5, obs.y * CELL_SIZE + CELL_SIZE - 5);
                    ctx.moveTo(obs.x * CELL_SIZE + CELL_SIZE - 5, obs.y * CELL_SIZE + 5);
                    ctx.lineTo(obs.x * CELL_SIZE + 5, obs.y * CELL_SIZE + CELL_SIZE - 5);
                    ctx.stroke();
                });

                // Comida
                if (food) {
                    const pulse = Math.sin(foodPulse) * 3;
                    const cx = food.x * CELL_SIZE + CELL_SIZE / 2;
                    const cy = food.y * CELL_SIZE + CELL_SIZE / 2;

                    ctx.shadowBlur = 12 + pulse;

                    if (foodType === 'golden') {
                        ctx.fillStyle = '#ffd700';
                        ctx.shadowColor = '#ffd700';
                        drawStar(cx, cy, 5, CELL_SIZE / 2.5 + pulse / 2, CELL_SIZE / 4 + pulse / 4);
                    } else if (foodType === 'poison') {
                        ctx.fillStyle = '#ff4444';
                        ctx.shadowColor = '#ff4444';
                        ctx.beginPath();
                        ctx.arc(cx, cy, CELL_SIZE / 3 + pulse / 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(cx - 2, cy - 1, 1.5, 0, Math.PI * 2);
                        ctx.arc(cx + 2, cy - 1, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = '#00ff88';
                        ctx.shadowColor = '#00ff88';
                        ctx.beginPath();
                        ctx.arc(cx, cy, CELL_SIZE / 3 + pulse / 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }

                // Power-up
                if (powerUp) {
                    const cx = powerUp.x * CELL_SIZE + CELL_SIZE / 2;
                    const cy = powerUp.y * CELL_SIZE + CELL_SIZE / 2;
                    const colors = { speed: '#00d4ff', ghost: '#aa66ff', magnet: '#ffaa00' };
                    const icons = { speed: '', ghost: '', magnet: '' };

                    ctx.fillStyle = colors[powerUp.type];
                    ctx.shadowColor = colors[powerUp.type];
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(cx, cy, CELL_SIZE / 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = '#000';
                    ctx.font = `${CELL_SIZE / 2}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(icons[powerUp.type], cx, cy);
                }

                // Snake
                snake.forEach((segment, i) => {
                    const x = segment.x * CELL_SIZE;
                    const y = segment.y * CELL_SIZE;
                    const isHead = i === 0;

                    if (activePowerUps.ghost > 0) {
                        ctx.globalAlpha = 0.6 + Math.sin(frameCount * 0.2) * 0.2;
                    }

                    ctx.shadowColor = isHead ? '#00ff88' : '#00aa55';
                    ctx.shadowBlur = isHead ? 12 : 4;

                    const gradient = ctx.createRadialGradient(
                        x + CELL_SIZE / 2, y + CELL_SIZE / 2, 0,
                        x + CELL_SIZE / 2, y + CELL_SIZE / 2, CELL_SIZE / 2
                    );
                    gradient.addColorStop(0, isHead ? '#88ffaa' : '#00cc66');
                    gradient.addColorStop(1, isHead ? '#00ff88' : '#008844');

                    ctx.fillStyle = gradient;
                    const pad = isHead ? 1 : 3;
                    roundRect(ctx, x + pad, y + pad, CELL_SIZE - pad * 2, CELL_SIZE - pad * 2, 3);
                    ctx.fill();

                    // Ojos en la cabeza
                    if (isHead) {
                        ctx.fillStyle = '#000';
                        ctx.shadowBlur = 0;
                        const eyeOffset = 3;
                        const eyeSize = 2.5;
                        let ex1 = x + CELL_SIZE / 2 - eyeOffset, ey1 = y + CELL_SIZE / 2 - 1;
                        let ex2 = x + CELL_SIZE / 2 + eyeOffset, ey2 = y + CELL_SIZE / 2 - 1;

                        if (direction.x === 1) { ex1 += 1; ex2 += 1; }
                        if (direction.x === -1) { ex1 -= 1; ex2 -= 1; }
                        if (direction.y === -1) { ey1 -= 1; ey2 -= 1; }
                        if (direction.y === 1) { ey1 += 1; ey2 += 1; }

                        ctx.beginPath();
                        ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
                        ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                });

                // Partículas
                particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 4;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // Textos flotantes
                floatingTexts.forEach(t => {
                    ctx.globalAlpha = t.life;
                    ctx.fillStyle = t.color;
                    ctx.font = `bold ${Math.max(10, CELL_SIZE)}px Orbitron`;
                    ctx.textAlign = 'center';
                    ctx.fillText(t.text, t.x, t.y);
                });
                ctx.globalAlpha = 1;

                // Modo fantasma: borde de pantalla
                if (activePowerUps.ghost > 0) {
                    ctx.strokeStyle = 'rgba(170, 102, 255, 0.25)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([8, 8]);
                    ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
                    ctx.setLineDash([]);
                }
            }

            requestAnimationFrame(draw);
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        let frameCount = 0;
        function gameLoop(timestamp) {
            frameCount++;
            // update y draw se manejan por separado
        }

        // Prevenir scroll/zoom en móvil
        document.addEventListener('touchmove', (e) => {
            if (gameState === 'playing') e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('gesturechange', (e) => e.preventDefault());
        document.addEventListener('gestureend', (e) => e.preventDefault());

        // Iniciar bucles
        requestAnimationFrame(update);
        requestAnimationFrame(draw);

        // Inicializar
        resizeCanvas();
